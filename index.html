<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediCare - Doctor Patient Appointment System</title>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel Compiler -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      --bg-gradient: linear-gradient(135deg, #eef2ff 0%, #e0f2fe 50%, #eff6ff 100%);
      --card-bg: rgba(255, 255, 255, 0.95);
      --card-border: rgba(203, 213, 225, 0.8);
      --primary-accent: #2563eb;
      --primary-gradient: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      --doctor-accent: #0d9488;
      --doctor-gradient: linear-gradient(135deg, #0d9488 0%, #0f766e 100%);
      --secondary-accent: #059669;
      --text-main: #0f172a;
      --text-muted: #475569;
      --emergency-bg: #fef2f2;
      --emergency-border: #ef4444;
      --emergency-text: #991b1b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; width: 100%; font-family: var(--font-family); background: var(--bg-gradient); color: var(--text-main); overflow-x: hidden; }

    .glass-panel {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      box-shadow: 0 10px 30px -10px rgba(14, 116, 144, 0.12);
    }

    .btn-primary {
      background: var(--primary-gradient);
      color: #ffffff;
      font-weight: 700;
      border: none;
      padding: 10px 20px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.25s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.25);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35);
    }

    .btn-secondary {
      background: #ffffff;
      color: var(--text-main);
      border: 1px solid var(--card-border);
      font-weight: 600;
      padding: 10px 18px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }

    .btn-secondary:hover { background: #f8fafc; border-color: var(--primary-accent); }

    .navbar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 18px 40px; position: sticky; top: 0; z-index: 100;
      background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
    }

    .nav-links { display: flex; gap: 20px; align-items: center; }
    .nav-link { color: var(--text-muted); text-decoration: none; font-weight: 600; cursor: pointer; transition: color 0.2s ease; }
    .nav-link.active, .nav-link:hover { color: var(--primary-accent); }

    .container { max-width: 1240px; margin: 0 auto; padding: 30px 20px; }

    .hero { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: center; padding: 40px 0; }
    .hero-title { font-size: 2.8rem; font-weight: 800; line-height: 1.2; margin-bottom: 16px; color: #0f172a; }
    .hero-subtitle { font-size: 1.1rem; color: var(--text-muted); line-height: 1.6; margin-bottom: 28px; }

    .chat-drawer {
      position: fixed; bottom: 30px; right: 30px; width: 420px; max-width: 90vw; height: 580px;
      z-index: 200; display: flex; flex-direction: column; border-radius: 20px; overflow: hidden;
      box-shadow: 0 20px 40px rgba(14, 116, 144, 0.2);
    }

    .chat-header { padding: 16px 20px; background: #ffffff; border-bottom: 1px solid var(--card-border); display: flex; justify-content: space-between; align-items: center; }
    .chat-body { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: #f8fafc; }
    .chat-msg { padding: 12px 16px; border-radius: 14px; max-width: 85%; font-size: 0.92rem; line-height: 1.5; }
    .chat-msg.bot { background: #ffffff; border: 1px solid var(--card-border); align-self: flex-start; color: var(--text-main); box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
    .chat-msg.user { background: var(--primary-gradient); color: #ffffff; font-weight: 600; align-self: flex-end; }
    .chat-msg.emergency { background: var(--emergency-bg); border: 1px solid var(--emergency-border); color: var(--emergency-text); }
    .chat-footer { padding: 12px; background: #ffffff; display: flex; gap: 8px; border-top: 1px solid var(--card-border); }

    .chat-input { flex: 1; background: #f1f5f9; border: 1px solid var(--card-border); border-radius: 10px; padding: 10px 14px; color: var(--text-main); font-family: inherit; }
    .chat-input:focus { outline: none; border-color: var(--primary-accent); background: #ffffff; }

    .doctors-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; margin-top: 20px; }
    .doctor-card { padding: 24px; display: flex; flex-direction: column; gap: 16px; background: #ffffff; transition: transform 0.25s ease, box-shadow 0.25s ease; }
    .doctor-card:hover { transform: translateY(-4px); box-shadow: 0 12px 24px rgba(37, 99, 235, 0.15); border-color: var(--primary-accent); }
    .doctor-avatar { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary-accent); }

    .modal-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(6px); z-index: 300; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .modal-content { width: 100%; max-width: 520px; padding: 36px; background: #ffffff; border-radius: 24px; box-shadow: 0 20px 40px rgba(14, 116, 144, 0.15); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const DOCTORS_DATA = [
      {
        id: "doc-101",

      },
      {

      },
      {
        id: "doc-103",
        name: "Dr. Vikram Sethi",
        specialization: "Neurologist",

        rating: 4.95,

        avatar: "https://images.unsplash.com/photo-1537368910025-700350fe46c7?w=150&auto=format&fit=crop&q=80"
      },
      {
        id: "doc-104",
        name: "Dr. Sunita Patel",

        rating: 4.7,

      },
      {

      },
      {
        id: "doc-106",
        name: "Dr. Priya Roy",
        specialization: "General Physician",
        qualification: "MBBS, MD (General Medicine) - 8 Yrs Exp",
        rating: 4.75,
        fee: 500,
        location: "City Care Family Clinic",
        available_slots: ["09:00 AM", "11:00 AM", "03:00 PM", "07:00 PM"],
        avatar: "https://images.unsplash.com/photo-1594824813566-88855ce78c4a?w=150&auto=format&fit=crop&q=80"
      }
    ];

    // Custom 3D Vector Icons
    const UserAvatar3DIcon = () => (
      <svg width="42" height="42" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="36" r="20" fill="#ffffff" />
        <path d="M20 82 C20 62 34 52 50 52 C66 52 80 62 80 82 Z" fill="#ffffff" />
      </svg>
    );

    const PatientIconSVG = ({ active }) => (
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke={active ? "#ffffff" : "#475569"} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
        <circle cx="12" cy="7" r="4"></circle>
      </svg>
    );

    const DoctorIconSVG = ({ active }) => (
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke={active ? "#ffffff" : "#475569"} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M12 2v4M10 4h4"></path>
        <path d="M4 19v-2a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v2"></path>
        <circle cx="12" cy="9" r="3"></circle>
        <path d="M8 14v4a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2v-4"></path>
      </svg>
    );

    const PhoneOtpBadgeSVG = () => (
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="5" y="2" width="14" height="20" rx="3" fill="#2563eb" />
        <rect x="7" y="5" width="10" height="12" rx="1" fill="#ffffff" opacity="0.9" />
        <rect x="9" y="7" width="2" height="2" rx="0.5" fill="#3b82f6" />
        <rect x="13" y="7" width="2" height="2" rx="0.5" fill="#3b82f6" />
        <rect x="9" y="10" width="2" height="2" rx="0.5" fill="#3b82f6" />
        <rect x="13" y="10" width="2" height="2" rx="0.5" fill="#3b82f6" />
        <circle cx="12" cy="19" r="1" fill="#ffffff" />
      </svg>
    );

    // Main App Component
    function App() {
      const [activeTab, setActiveTab] = useState('home');
      const [isChatOpen, setIsChatOpen] = useState(false);
      
      const [currentUser, setCurrentUser] = useState(null);
      const [isLoggedIn, setIsLoggedIn] = useState(false);

      const [doctors] = useState(DOCTORS_DATA);
      const [selectedSpecialist, setSelectedSpecialist] = useState('');
      const [searchTerm, setSearchTerm] = useState('');
      const [selectedDoctor, setSelectedDoctor] = useState(null);
      const [appointments, setAppointments] = useState([
        {
          id: "apt-901",
          patient_name: "Rohan Das",
          patient_age: 28,
          doctor_name: "Dr. Rajesh Sharma",
          specialization: "Cardiologist",
          date: "2026-08-28",
          slot: "11:30 AM",
          status: "Confirmed",
          symptoms: "Chest tightness and occasional palpitations",
          ai_summary: "Patient reports chest tightness & palpitations. Preliminary Assessment: Angina/Arrhythmia. Recommended Cardiologist."
        }
      ]);

      const handleLoginSuccess = (user) => {
        setCurrentUser(user);
        setIsLoggedIn(true);
        if (user.role === 'doctor') {
          setActiveTab('doctor');
        } else {
          setActiveTab('patient');
        }
      };

      const handleLogout = () => {
        setCurrentUser(null);
        setIsLoggedIn(false);
        setActiveTab('home');
      };

      const handleBookingSuccess = (newApt) => {
        setAppointments([newApt, ...appointments]);
        setSelectedDoctor(null);
        setActiveTab('patient');
      };

      const filteredDoctors = doctors.filter(doc => {
        const matchSpec = selectedSpecialist ? doc.specialization.toLowerCase().includes(selectedSpecialist.toLowerCase()) : true;
        const matchSearch = searchTerm ? (
          doc.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
          doc.specialization.toLowerCase().includes(searchTerm.toLowerCase())
        ) : true;
        return matchSpec && matchSearch;
      });

      // SCREEN 1: DIRECT MEDICARE LOGIN PAGE
      if (!isLoggedIn || !currentUser) {
        return <MedicareAuthWidget onLogin={handleLoginSuccess} />;
      }

      // SCREEN 2: LOGGED IN APPLICATION PORTAL
      return (
        <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column' }}>
          {/* Navbar */}
          <nav className="navbar">
            <div style={{ display: 'flex', alignItems: 'center', gap: '12px', cursor: 'pointer' }} onClick={() => setActiveTab('home')}>
              <svg width="36" height="36" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M50 88 C20 65 8 45 8 28 C8 15 18 6 31 6 C40 6 46 11 50 16 C54 11 60 6 69 6 C82 6 92 15 92 28 C92 45 80 65 50 88 Z" stroke="#2563eb" strokeWidth="7" fill="none" strokeLinejoin="round"/>
                <rect x="45" y="24" width="10" height="24" rx="3" fill="#2563eb"/>
                <rect x="38" y="31" width="24" height="10" rx="3" fill="#2563eb"/>
                <circle cx="22" cy="72" r="7" stroke="#2563eb" strokeWidth="4" fill="#ffffff"/>
                <circle cx="22" cy="72" r="3" fill="#2563eb"/>
                <path d="M22 65 C22 55 26 48 30 48" stroke="#2563eb" strokeWidth="4" strokeLinecap="round" fill="none"/>
              </svg>
              <div>
                <h2 style={{ fontSize: '1.4rem', fontWeight: 800, margin: 0, color: '#1e3a8a' }}>MediCare</h2>
                <p style={{ fontSize: '0.75rem', color: '#3b82f6', fontWeight: 600 }}>Your Health, Our Priority</p>
              </div>
            </div>

            <div className="nav-links">
              <span className={`nav-link ${activeTab === 'home' ? 'active' : ''}`} onClick={() => setActiveTab('home')}>Find Doctors</span>
              <span className={`nav-link ${activeTab === 'patient' ? 'active' : ''}`} onClick={() => setActiveTab('patient')}>👤 Patient Portal</span>
              <span className={`nav-link ${activeTab === 'doctor' ? 'active' : ''}`} onClick={() => setActiveTab('doctor')}>👨‍⚕️ Doctor Dashboard</span>
              
              <button className="btn-primary" onClick={() => setIsChatOpen(true)}>🤖 AI Health Assistant</button>

              {currentUser ? (
                <div style={{ display: 'flex', alignItems: 'center', gap: '10px', paddingLeft: '10px', borderLeft: '1px solid var(--card-border)' }}>
                  <div style={{ textAlign: 'right' }}>
                    <div style={{ fontWeight: 700, fontSize: '0.85rem', color: '#0f172a' }}>{currentUser.name}</div>
                    <span style={{ fontSize: '0.72rem', color: currentUser.role === 'doctor' ? 'var(--doctor-accent)' : 'var(--primary-accent)', textTransform: 'capitalize', fontWeight: 700 }}>● {currentUser.role}</span>
                  </div>
                  <button onClick={handleLogout} className="btn-secondary" style={{ padding: '6px 12px', fontSize: '0.8rem' }}>Logout</button>
                </div>
              ) : (
                <button className="btn-secondary" onClick={() => setIsLoggedIn(false)}>🔑 Login / Sign Up</button>
              )}
            </div>
          </nav>

          {/* Tab 1: Home / Doctor Finder */}
          {activeTab === 'home' && (
            <div className="container" style={{ flex: 1 }}>
              <div className="hero">
                <div>
                  <span style={{ background: 'rgba(37, 99, 235, 0.08)', border: '1px solid rgba(37, 99, 235, 0.2)', padding: '6px 14px', borderRadius: '20px', fontSize: '0.82rem', color: '#2563eb', display: 'inline-block', marginBottom: '16px', fontWeight: 700 }}>
                    ✨ AI Symptom Assessment & Specialist Matching
                  </span>
                  <h1 className="hero-title">Smart Healthcare <br/><span style={{ color: '#2563eb' }}>Instant Appointments</span></h1>
                  <p className="hero-subtitle">
                    Describe your symptoms to our 24/7 AI Chatbot. Get matched with top verified doctors and schedule your clinic appointments instantly.
                  </p>
                  <div style={{ display: 'flex', gap: '14px', flexWrap: 'wrap' }}>
                    <button className="btn-primary" onClick={() => setIsChatOpen(true)}>🤖 Start AI Symptom Check</button>
                  </div>
                </div>

                <div className="glass-panel" style={{ padding: '30px', background: '#ffffff' }}>
                  <h3 style={{ fontSize: '1.2rem', marginBottom: '16px', color: '#2563eb' }}>🔐 MediCare System Features</h3>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: '14px', fontSize: '0.88rem', color: 'var(--text-muted)' }}>
                    <div><strong>👤 Patient Portal:</strong> Mobile OTP / Google Login to access bookings & AI Chatbot.</div>
                    <div><strong>👨‍⚕️ Doctor Portal:</strong> Professional doctor portal for schedule & AI pre-consultation summaries.</div>
                    <div><strong>🚨 Emergency Triage:</strong> High-risk symptom alert detection.</div>
                  </div>
                </div>
              </div>

              <div id="doctors-list" style={{ marginTop: '40px' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '20px' }}>
                  <div>
                    <h2 style={{ fontSize: '1.6rem', fontWeight: 800 }}>Available <span style={{ color: '#2563eb' }}>Medical Specialists</span></h2>
                    {selectedSpecialist && (
                      <p style={{ color: 'var(--secondary-accent)', fontSize: '0.85rem' }}>
                        Filtered by AI Recommendation: <strong>{selectedSpecialist}</strong> {' '}
                        <button onClick={() => setSelectedSpecialist('')} style={{ background: 'none', border: 'none', color: '#ef4444', cursor: 'pointer', textDecoration: 'underline' }}>(Clear)</button>
                      </p>
                    )}
                  </div>
                  <input
                    type="text"
                    className="chat-input"
                    style={{ width: '250px' }}
                    placeholder="Search doctor or specialty..."
                    value={searchTerm}
                    onChange={e => setSearchTerm(e.target.value)}
                  />
                </div>

                <div className="doctors-grid">
                  {filteredDoctors.map(doc => (
                    <div key={doc.id} className="doctor-card glass-panel">
                      <div style={{ display: 'flex', gap: '16px', alignItems: 'center' }}>
                        <img src={doc.avatar} alt={doc.name} className="doctor-avatar" />
                        <div>
                          <h3 style={{ fontSize: '1.1rem', fontWeight: 700, color: '#0f172a' }}>{doc.name}</h3>
                          <span style={{ color: '#2563eb', fontSize: '0.85rem', fontWeight: 600 }}>{doc.specialization}</span>
                          <p style={{ color: 'var(--text-muted)', fontSize: '0.78rem' }}>{doc.qualification}</p>
                        </div>
                      </div>
                      <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '0.85rem' }}>
                        <span>⭐ {doc.rating}</span>
                        <span>Fee: <strong>₹{doc.fee}</strong></span>
                      </div>
                      <p style={{ fontSize: '0.8rem', color: 'var(--text-muted)' }}>📍 {doc.location}</p>
                      <button className="btn-primary" style={{ width: '100%', justifyContent: 'center' }} onClick={() => setSelectedDoctor(doc)}>
                        📅 Book Appointment
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* Tab 2: Patient Portal */}
          {activeTab === 'patient' && (
            <div className="container">
              <h2 style={{ fontSize: '1.8rem', fontWeight: 800, marginBottom: '20px' }}>Patient <span style={{ color: '#2563eb' }}>Portal</span></h2>
              <div style={{ display: 'grid', gridTemplateColumns: '2fr 1fr', gap: '24px' }}>
                <div>
                  <h3 style={{ fontSize: '1.2rem', marginBottom: '16px' }}>Scheduled Appointments</h3>
                  {appointments.map((apt, idx) => (
                    <div key={idx} className="glass-panel" style={{ padding: '20px', marginBottom: '16px', borderLeft: '4px solid #2563eb', background: '#ffffff' }}>
                      <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                        <h4>{apt.doctor_name}</h4>
                        <span style={{ background: '#ecfdf5', color: '#047857', padding: '4px 10px', borderRadius: '12px', fontSize: '0.75rem', fontWeight: 700 }}>✓ {apt.status}</span>

                      <p style={{ color: '#2563eb', fontSize: '0.85rem', margin: '4px 0' }}>{apt.specialization}</p>
                      <p style={{ fontSize: '0.85rem', color: 'var(--text-muted)' }}>📅 Date: {apt.date} | ⏰ Time: {apt.slot}</p>
                      <div style={{ background: '#f8fafc', padding: '10px', borderRadius: '8px', marginTop: '10px', fontSize: '0.82rem', border: '1px solid #e2e8f0' }}>
                        <strong>Reported Symptoms:</strong> {apt.symptoms}<br/>
                        <strong style={{ color: '#2563eb' }}>AI Note:</strong> {apt.ai_summary}
                      </div>
                    </div>
                  ))}
                </div>
                <div className="glass-panel" style={{ padding: '24px', background: '#ffffff' }}>
                  <h4>Patient Profile</h4>
                  <p style={{ marginTop: '10px', fontSize: '0.9rem', color: 'var(--text-muted)' }}>
                    Name: {currentUser ? currentUser.name : 'Rohan Das'}<br/>
                    Account Type: Patient<br/>
                    Phone: {currentUser && currentUser.phone ? currentUser.phone : '+91 98765 43210'}<br/>
                    Blood Group: O+ Positive
                  </p>
                </div>
              </div>
            </div>
          )}

          {/* Tab 3: Doctor Dashboard */}
          {activeTab === 'doctor' && (
            <div className="container">
              <h2 style={{ fontSize: '1.8rem', fontWeight: 800, marginBottom: '20px' }}>Doctor <span style={{ color: '#2563eb' }}>Dashboard</span></h2>
              <p style={{ color: 'var(--text-muted)', marginBottom: '16px' }}>Logged in as: <strong>{currentUser ? currentUser.name : 'Dr. Rajesh Sharma'}</strong> (Cardiology Department)</p>
              <h3 style={{ fontSize: '1.2rem', marginBottom: '16px' }}>Today's Patient Queue</h3>

    // Chatbot Component
    function ChatWidget({ onClose, onFilterSpec }) {
      const [msgs, setMsgs] = useState([
        { sender: 'bot', text: "Hello! I am your MediAI Health Assistant. 👋\nDescribe your symptoms (e.g. 'chest pain', 'skin rash', 'wheezing') to receive an AI assessment and doctor recommendation." }
      ]);
      const [input, setInput] = useState('');

      const handleSend = () => {
        if (!input.trim()) return;
        const text = input.trim();
        setInput('');
        setMsgs(prev => [...prev, { sender: 'user', text }]);

        setTimeout(() => {
          const isEmerg = /chest pain|shortness of breath|stroke|slurred speech/i.test(text);
          let reply = "";
          let spec = "General Physician";

          if (isEmerg) {
            reply = "⚠️ CRITICAL ALERT: Your reported symptoms indicate a potential medical emergency (e.g. cardiac event). Please visit the nearest Emergency Room (ER) immediately!";
            spec = "Cardiologist";
          } else if (/skin|rash|acne|itching/i.test(text)) {
            reply = "Based on your skin symptoms, our AI assessment suggests consulting a Dermatologist.";
            spec = "Dermatologist";
          } else if (/headache|numbness|dizziness|brain/i.test(text)) {
            reply = "Based on your neurological symptoms, we recommend consulting a Neurologist.";
            spec = "Neurologist";
          } else if (/cough|wheezing|fever|breathe/i.test(text)) {
            reply = "Based on your respiratory symptoms, we recommend consulting a Pulmonologist.";
            spec = "Pulmonologist";
          } else {
            reply = `Based on your reported symptoms ('${text}'), we recommend consulting a General Physician for preliminary diagnosis.`;
          }

          setMsgs(prev => [...prev, { sender: 'bot', text: reply, isEmerg, spec }]);
        }, 600);
      };

      return (
        <div className="chat-drawer glass-panel">
          <div className="chat-header">
            <h4 style={{ color: '#0f172a' }}>🤖 AI Health Assistant</h4>
            <button onClick={onClose} style={{ background: 'none', border: 'none', color: '#64748b', cursor: 'pointer', fontSize: '1.1rem' }}>✕</button>
          </div>
          <div className="chat-body">
            {msgs.map((m, i) => (
              <div key={i} className={`chat-msg ${m.sender} ${m.isEmerg ? 'emergency' : ''}`}>
                <p style={{ whiteSpace: 'pre-line' }}>{m.text}</p>
                {m.spec && !m.isEmerg && (
                  <button className="btn-primary" style={{ marginTop: '8px', fontSize: '0.8rem', width: '100%', justifyContent: 'center' }} onClick={() => onFilterSpec(m.spec)}>
                    Find {m.spec} Doctors →
                  </button>
                )}
              </div>
            ))}
          </div>
          <div className="chat-footer">
            <input className="chat-input" placeholder="Type symptoms..." value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&handleSend()} />
            <button className="btn-primary" onClick={handleSend}>Send</button>
          </div>
        </div>
      );
    }
