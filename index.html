<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediCare - AI Powered Doctor-Patient Appointment Portal</title>
  
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel Compiler -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Official Google Identity Services (GSI) Library -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  
  <!-- Google Fonts: Plus Jakarta Sans & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --primary-light: #60a5fa;
      --primary-glow: rgba(37, 99, 235, 0.35);
      --accent-teal: #0d9488;
      --accent-cyan: #06b6d4;
      --accent-emerald: #10b981;
      --bg-dark: #090d16;
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --card-bg: rgba(255, 255, 255, 0.92);
      --card-border: rgba(226, 232, 240, 0.8);
      --glass-shadow: 0 25px 60px -15px rgba(37, 99, 235, 0.18);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      width: 100%;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: #f0f7ff;
      color: var(--text-dark);
      overflow-x: hidden;
    }

    /* Dynamic Floating Mesh Background */
    .bg-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      background: linear-gradient(135deg, #eef2ff 0%, #e0f2fe 40%, #f0fdf4 80%, #f8fafc 100%);
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.6;
      animation: floatOrb 18s ease-in-out infinite alternate;
    }

    .orb-1 { width: 450px; height: 450px; background: #93c5fd; top: -100px; left: -100px; animation-duration: 22s; }
    .orb-2 { width: 500px; height: 500px; background: #a7f3d0; bottom: -120px; left: 30%; animation-duration: 26s; animation-delay: -5s; }
    .orb-3 { width: 400px; height: 400px; background: #c7d2fe; top: 15%; right: -80px; animation-duration: 20s; animation-delay: -10s; }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(60px, 40px) scale(1.08); }
      100% { transform: translate(-40px, 80px) scale(0.95); }
    }

    /* Wave animation */
    .animated-waves {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 28vh;
      min-height: 160px;
      z-index: 1;
      opacity: 0.85;
    }

    .wave-path-1 {
      animation: waveDrift 14s ease-in-out infinite alternate;
    }
    .wave-path-2 {
      animation: waveDrift 18s ease-in-out infinite alternate-reverse;
    }

    @keyframes waveDrift {
      0% { transform: translateX(0) scaleY(1); }
      50% { transform: translateX(-3%) scaleY(1.06); }
      100% { transform: translateX(2%) scaleY(0.96); }
    }

    /* Glassmorphism Card */
    .glass-auth-card {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 28px;
      padding: 34px 30px;
      box-shadow: 0 25px 60px -12px rgba(37, 99, 235, 0.18), 0 0 0 1px rgba(226, 232, 240, 0.7);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .glass-auth-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 200%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
      transform: rotate(25deg);
      pointer-events: none;
      animation: cardShine 8s infinite;
    }

    @keyframes cardShine {
      0%, 80% { left: -100%; }
      100% { left: 100%; }
    }

    /* Floating UI Badges */
    .floating-badge {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.95);
      border-radius: 18px;
      padding: 14px 18px;
      box-shadow: 0 12px 30px rgba(37, 99, 235, 0.1);
      display: inline-flex;
      align-items: center;
      gap: 12px;
      animation: floatBadge 6s ease-in-out infinite alternate;
    }

    @keyframes floatBadge {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }

    .pulse-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
      animation: pulseGreen 2s infinite;
    }

    @keyframes pulseGreen {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    /* Input with glowing animated border */
    .glow-input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #cbd5e1;
      border-radius: 12px;
      font-size: 0.92rem;
      font-family: inherit;
      color: #0f172a;
      background: #ffffff;
      outline: none;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .glow-input:focus {
      border-color: #2563eb;
      background: #ffffff;
      box-shadow: 0 0 0 3.5px rgba(37, 99, 235, 0.15);
      transform: translateY(-1px);
    }

    /* Interactive Buttons */
    .btn-gradient-primary {
      width: 100%;
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: #ffffff;
      font-weight: 700;
      font-size: 0.94rem;
      padding: 13px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 8px 22px rgba(37, 99, 235, 0.28);
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
    }

    .btn-gradient-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(37, 99, 235, 0.38);
      background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
    }

    .btn-gradient-primary:active {
      transform: translateY(0);
    }

    .btn-gradient-primary:disabled {
      background: #94a3b8;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    /* Modern Google Button */
    .btn-google-signin {
      width: 100%;
      background: #ffffff;
      border: 1.5px solid #dadce0;
      border-radius: 14px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.9rem;
      color: #1f1f1f;
      transition: all 0.2s ease;
      box-shadow: 0 2px 6px rgba(60,64,67,0.08);
      margin-bottom: 14px;
      font-family: inherit;
    }

    .btn-google-signin:hover {
      background: #f8fafd;
      border-color: #0b57d0;
      box-shadow: 0 4px 14px rgba(11, 87, 208, 0.16);
      transform: translateY(-1px);
    }

    .btn-google-signin:active {
      transform: translateY(0);
    }

    /* 6-Digit OTP Box Grid */
    .otp-digit-input {
      width: 46px;
      height: 52px;
      text-align: center;
      font-size: 1.3rem;
      font-weight: 800;
      border: 1.5px solid #cbd5e1;
      border-radius: 12px;
      background: #ffffff;
      color: #0f172a;
      outline: none;
      transition: all 0.2s ease;
    }

    .otp-digit-input:focus {
      border-color: #2563eb;
      background: #eff6ff;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
      transform: scale(1.05);
    }

    .otp-digit-input.filled {
      border-color: #2563eb;
      background: #eff6ff;
      color: #1d4ed8;
    }

    /* Shake Animation for Invalid OTP */
    .shake-animation {
      animation: shake 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    @keyframes shake {
      10%, 90% { transform: translate3d(-1px, 0, 0); }
      20%, 80% { transform: translate3d(2px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-3px, 0, 0); }
      40%, 60% { transform: translate3d(3px, 0, 0); }
    }

    /* Navbar & Main App UI */
    .navbar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 40px; position: sticky; top: 0; z-index: 100;
      background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--card-border);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
    }
    .nav-links { display: flex; gap: 20px; align-items: center; }
    .nav-link { color: var(--text-muted); text-decoration: none; font-weight: 600; cursor: pointer; transition: color 0.2s ease; }
    .nav-link.active, .nav-link:hover { color: var(--primary); }
    .container { max-width: 1240px; margin: 0 auto; padding: 30px 20px; }
    
    .chat-drawer {
      position: fixed; bottom: 30px; right: 30px; width: 420px; max-width: 90vw; height: 580px;
      z-index: 200; display: flex; flex-direction: column; border-radius: 20px; overflow: hidden;
      box-shadow: 0 20px 40px rgba(14, 116, 144, 0.2); background: #ffffff;
      border: 1px solid var(--card-border);
    }
    .chat-header { padding: 16px 20px; background: #ffffff; border-bottom: 1px solid var(--card-border); display: flex; justify-content: space-between; align-items: center; }
    .chat-body { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: #f8fafc; }
    .chat-msg { padding: 12px 16px; border-radius: 14px; max-width: 85%; font-size: 0.92rem; line-height: 1.5; }
    .chat-msg.bot { background: #ffffff; border: 1px solid var(--card-border); align-self: flex-start; color: var(--text-dark); box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
    .chat-msg.user { background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); color: #ffffff; font-weight: 600; align-self: flex-end; }
    .chat-footer { padding: 12px; background: #ffffff; display: flex; gap: 8px; border-top: 1px solid var(--card-border); }
    
    .doctors-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; margin-top: 20px; }
    .doctor-card { padding: 24px; display: flex; flex-direction: column; gap: 16px; background: #ffffff; border-radius: 16px; border: 1px solid var(--card-border); transition: transform 0.25s ease, box-shadow 0.25s ease; }
    .doctor-card:hover { transform: translateY(-4px); box-shadow: 0 14px 28px rgba(37, 99, 235, 0.12); border-color: var(--primary); }
    .doctor-avatar { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary); }

    .modal-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(6px); z-index: 300; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .modal-content { width: 100%; max-width: 520px; padding: 36px; background: #ffffff; border-radius: 24px; box-shadow: 0 20px 40px rgba(14, 116, 144, 0.15); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const API_BASE = 'http://localhost:8000';

    const DOCTORS_DATA = [
      {
        id: "doc-101",
        name: "Dr. Rajesh Sharma",
        specialization: "Cardiologist",
        qualification: "MD, DM (Cardiology) - 15 Yrs Exp",
        rating: 4.9,
        fee: 800,
        location: "Central Heart Hospital, Metro City",
        available_slots: ["09:00 AM", "11:30 AM", "04:00 PM", "06:30 PM"],
        avatar: "https://images.unsplash.com/photo-1622253692010-333f2da6031d?w=150&auto=format&fit=crop&q=80"
      },
      {
        id: "doc-102",
        name: "Dr. Ananya Verma",
        specialization: "Dermatologist",
        qualification: "MD (Dermatology) - 10 Yrs Exp",
        rating: 4.8,
        fee: 650,
        location: "Skin & Glow Clinic, Sector 18",
        available_slots: ["10:00 AM", "01:00 PM", "03:30 PM", "05:00 PM"],
        avatar: "https://images.unsplash.com/photo-1594824813566-88855ce78c4a?w=150&auto=format&fit=crop&q=80"
      },
      {
        id: "doc-103",
        name: "Dr. Vikram Sethi",
        specialization: "Neurologist",
        qualification: "DM (Neurology), AIIMS - 18 Yrs Exp",
        rating: 4.95,
        fee: 1000,
        location: "Brain Care Institute, Tech Park",
        available_slots: ["11:00 AM", "02:00 PM", "05:30 PM"],
        avatar: "https://images.unsplash.com/photo-1537368910025-700350fe46c7?w=150&auto=format&fit=crop&q=80"
      },
      {
        id: "doc-104",
        name: "Dr. Sunita Patel",
        specialization: "Pulmonologist",
        qualification: "MD (Pulmonary Medicine) - 12 Yrs Exp",
        rating: 4.7,
        fee: 700,
        location: "Breathe Easy Respiratory Care",
        available_slots: ["09:30 AM", "12:30 PM", "04:30 PM"],
        avatar: "https://images.unsplash.com/photo-1559839734-2b71ea197ec2?w=150&auto=format&fit=crop&q=80"
      },
      {
        id: "doc-105",
        name: "Dr. Arvind Mehta",
        specialization: "Orthopedist",
        qualification: "MS (Orthopedics) - 14 Yrs Exp",
        rating: 4.85,
        fee: 750,
        location: "Joint & Bone Care Clinic",
        available_slots: ["10:30 AM", "02:30 PM", "06:00 PM"],
        avatar: "https://images.unsplash.com/photo-1612349317150-e413f6a5b16d?w=150&auto=format&fit=crop&q=80"
      },
      {
        id: "doc-106",
        name: "Dr. Priya Roy",
        specialization: "General Physician",
        qualification: "MBBS, MD (General Medicine) - 8 Yrs Exp",
        rating: 4.75,
        fee: 500,
        location: "City Care Family Clinic",
        available_slots: ["09:00 AM", "11:00 AM", "03:00 PM", "07:00 PM"],
        avatar: "https://images.unsplash.com/photo-1594824813566-88855ce78c4a?w=150&auto=format&fit=crop&q=80"
      }
    ];

    // Crisp Vector Icons
    const MedicalCrossLogo = () => (
      <svg width="40" height="40" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M50 88 C20 65 8 45 8 28 C8 15 18 6 31 6 C40 6 46 11 50 16 C54 11 60 6 69 6 C82 6 92 15 92 28 C92 45 80 65 50 88 Z" stroke="#2563eb" strokeWidth="7" fill="#eff6ff" strokeLinejoin="round"/>
        <rect x="45" y="24" width="10" height="24" rx="3" fill="#2563eb"/>
        <rect x="38" y="31" width="24" height="10" rx="3" fill="#2563eb"/>
        <circle cx="22" cy="72" r="7" stroke="#2563eb" strokeWidth="4" fill="#ffffff"/>
        <circle cx="22" cy="72" r="3" fill="#2563eb"/>
        <path d="M22 65 C22 55 26 48 30 48" stroke="#2563eb" strokeWidth="4" strokeLinecap="round" fill="none"/>
      </svg>
    );

    const PatientIconSVG = ({ active }) => (
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke={active ? "#ffffff" : "#475569"} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
        <circle cx="12" cy="7" r="4"></circle>
      </svg>
    );

    const DoctorIconSVG = ({ active }) => (
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke={active ? "#ffffff" : "#475569"} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M12 2v4M10 4h4"></path>
        <path d="M4 19v-2a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v2"></path>
        <circle cx="12" cy="9" r="3"></circle>
        <path d="M8 14v4a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2v-4"></path>
      </svg>
    );

    const ShieldSecurityIcon = () => (
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2563eb" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        <path d="m9 12 2 2 4-4"></path>
      </svg>
    );

    // Main App Component
    function App() {
      const [activeTab, setActiveTab] = useState('home');
      const [isChatOpen, setIsChatOpen] = useState(false);
      
      // Auto-restore session from localStorage (e.g. from Google Auth)
      const [currentUser, setCurrentUser] = useState(() => {
        try {
          const saved = localStorage.getItem('medicare_current_user');
          return saved ? JSON.parse(saved) : null;
        } catch (e) {
          return null;
        }
      });
      const [isLoggedIn, setIsLoggedIn] = useState(() => {
        return !!localStorage.getItem('medicare_current_user');
      });

      const [doctors, setDoctors] = useState(DOCTORS_DATA);
      const [selectedSpecialist, setSelectedSpecialist] = useState('');
      const [searchTerm, setSearchTerm] = useState('');
      const [selectedDoctor, setSelectedDoctor] = useState(null);
      const [appointments, setAppointments] = useState([
        {
          id: "apt-901",
          patient_name: "Rohan Das",
          patient_age: 28,
          doctor_name: "Dr. Rajesh Sharma",
          specialization: "Cardiologist",
          date: "2026-08-28",
          slot: "11:30 AM",
          status: "Confirmed",
          symptoms: "Chest tightness and palpitations",
          ai_summary: "Patient reports chest tightness & palpitations. Preliminary Assessment: Angina/Arrhythmia. Recommended Cardiologist."
        }
      ]);

      const handleLoginSuccess = (user) => {
        setCurrentUser(user);
        setIsLoggedIn(true);
        if (user.role === 'doctor') {
          setActiveTab('doctor');
        } else {
          setActiveTab('patient');
        }
      };

      // Listen for Google Auth Popup postMessage
      useEffect(() => {
        const handleAuthMessage = (event) => {
          if (event.data && event.data.type === 'GOOGLE_AUTH_SUCCESS') {
            const user = event.data.user;
            if (user) {
              handleLoginSuccess(user);
            }
          }
        };
        window.addEventListener('message', handleAuthMessage);
        return () => window.removeEventListener('message', handleAuthMessage);
      }, []);

      const handleLogout = () => {
        localStorage.removeItem('medicare_access_token');
        localStorage.removeItem('medicare_refresh_token');
        localStorage.removeItem('medicare_current_user');
        setCurrentUser(null);
        setIsLoggedIn(false);
        setActiveTab('home');
      };

      const handleBookingSuccess = (newApt) => {
        setAppointments([newApt, ...appointments]);
        setSelectedDoctor(null);
        setActiveTab('patient');
      };

      const filteredDoctors = doctors.filter(doc => {
        const matchSpec = selectedSpecialist ? doc.specialization.toLowerCase().includes(selectedSpecialist.toLowerCase()) : true;
        const matchSearch = searchTerm ? (
          doc.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
          doc.specialization.toLowerCase().includes(searchTerm.toLowerCase())
        ) : true;
        return matchSpec && matchSearch;
      });

      if (!isLoggedIn || !currentUser) {
        return <DynamicAuthPortal onLogin={handleLoginSuccess} />;
      }

      return (
        <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column' }}>
          {/* Navbar */}
          <nav className="navbar">
            <div style={{ display: 'flex', alignItems: 'center', gap: '12px', cursor: 'pointer' }} onClick={() => setActiveTab('home')}>
              <MedicalCrossLogo />
              <div>
                <h2 style={{ fontSize: '1.4rem', fontWeight: 800, margin: 0, color: '#1e3a8a', fontFamily: "'Outfit', sans-serif" }}>MediCare</h2>
                <p style={{ fontSize: '0.75rem', color: '#3b82f6', fontWeight: 600 }}>Your Health, Our Priority</p>
              </div>
            </div>

            <div className="nav-links">
              <span className={`nav-link ${activeTab === 'home' ? 'active' : ''}`} onClick={() => setActiveTab('home')}>Find Doctors</span>
              <span className={`nav-link ${activeTab === 'patient' ? 'active' : ''}`} onClick={() => setActiveTab('patient')}>👤 Patient Portal</span>
              <span className={`nav-link ${activeTab === 'doctor' ? 'active' : ''}`} onClick={() => setActiveTab('doctor')}>👨‍⚕️ Doctor Dashboard</span>
              
              <button className="btn-gradient-primary" style={{ width: 'auto', padding: '9px 18px' }} onClick={() => setIsChatOpen(true)}>🤖 AI Assistant</button>

              <div style={{ display: 'flex', alignItems: 'center', gap: '10px', paddingLeft: '10px', borderLeft: '1px solid var(--card-border)' }}>
                {currentUser.avatar_url ? (
                  <img src={currentUser.avatar_url} style={{ width: '36px', height: '36px', borderRadius: '50%', objectFit: 'cover', border: '2px solid #2563eb' }} alt="Avatar" />
                ) : (
                  <div style={{ width: '36px', height: '36px', borderRadius: '50%', background: '#eff6ff', color: '#2563eb', border: '1.5px solid #bfdbfe', display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 700, fontSize: '0.9rem' }}>
                    {currentUser.name ? currentUser.name[0].toUpperCase() : 'U'}
                  </div>
                )}
                <div style={{ textAlign: 'right' }}>
                  <div style={{ fontWeight: 700, fontSize: '0.85rem', color: '#0f172a' }}>{currentUser.name}</div>
                  <span style={{ fontSize: '0.72rem', color: '#2563eb', textTransform: 'capitalize', fontWeight: 700 }}>● {currentUser.role}</span>
                </div>
                <button onClick={handleLogout} style={{ background: '#ffffff', border: '1px solid #cbd5e1', padding: '6px 12px', borderRadius: '8px', cursor: 'pointer', fontSize: '0.8rem', fontWeight: 600 }}>Logout</button>
              </div>
            </div>
          </nav>

          {/* Home View */}

    // DYNAMIC DESIGNER AUTHENTICATION PORTAL WITH SMOOTH ANIMATIONS
    function DynamicAuthPortal({ onLogin }) {
      const [authView, setAuthView] = useState('login'); // 'login' | 'signup'
      const [role, setRole] = useState('patient'); // 'patient' | 'doctor'
      const [authMode, setAuthMode] = useState('phone_otp'); // 'phone_otp' | 'email_otp' | 'password'

      // Form States
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [phone, setPhone] = useState('');
      
      // OTP Verification States
      const [otpStep, setOtpStep] = useState('enter_contact'); // 'enter_contact' | 'enter_code'
      const [otpDigits, setOtpDigits] = useState(['', '', '', '', '', '']);
      const [resendCountdown, setResendCountdown] = useState(0);
      const [isShaking, setIsShaking] = useState(false);
      const [notification, setNotification] = useState('');
      const [errorMessage, setErrorMessage] = useState('');
      const [loading, setLoading] = useState(false);

      // Sign Up States
      const [signupName, setSignupName] = useState('');
      const [signupEmail, setSignupEmail] = useState('');
      const [signupPhone, setSignupPhone] = useState('');
      const [signupPassword, setSignupPassword] = useState('');
      const [signupAge, setSignupAge] = useState('');
      const [signupSpecialization, setSignupSpecialization] = useState('General Physician');
      const [signupQualification, setSignupQualification] = useState('');
      const [signupFee, setSignupFee] = useState('');

      // Session helper
      const handleAuthSuccess = (data) => {
        if (data.access_token) {
          localStorage.setItem('medicare_access_token', data.access_token);
          localStorage.setItem('medicare_refresh_token', data.refresh_token);
        }
        if (data.user) {
          localStorage.setItem('has_logged_in_before', 'true');
          onLogin(data.user);
        }
      };

      // Google 1-Click Popup & Redirect Handler
      const handleGoogleLogin = () => {
        localStorage.setItem('medicare_auth_role', role);
        const width = 480;
        const height = 660;
        const left = Math.max(0, (window.screen.width - width) / 2);
        const top = Math.max(0, (window.screen.height - height) / 2);

        const authUrl = `google-auth.html?role=${encodeURIComponent(role)}`;
        const popup = window.open(
          authUrl,
          'GoogleAuthPopup',
          `width=${width},height=${height},top=${top},left=${left},status=no,resizable=yes,scrollbars=yes`
        );

        if (!popup || popup.closed || typeof popup.closed === 'undefined') {
          // If popup is blocked by browser, redirect directly
          window.location.href = authUrl;
        }
      };

      // Auto-handle login if Google Auth popup sends postMessage
      useEffect(() => {
        const onGoogleMessage = (e) => {
          if (e.data && e.data.type === 'GOOGLE_AUTH_SUCCESS') {
            if (e.data.user) {
              onLogin(e.data.user);
            }
          }
        };
        window.addEventListener('message', onGoogleMessage);
        return () => window.removeEventListener('message', onGoogleMessage);
      }, [onLogin]);

      // Resend Timer
      useEffect(() => {
        let timer;
        if (resendCountdown > 0) {
          timer = setInterval(() => setResendCountdown(p => p - 1), 1000);
        }
        return () => clearInterval(timer);
      }, [resendCountdown]);

      // 1. DISPATCH OTP (SMS / EMAIL)
      const handleDispatchOtp = async (e) => {
        if (e) e.preventDefault();
        setErrorMessage('');
        setNotification('');
        setLoading(true);

        if (authMode === 'phone_otp') {
          const cleanDigits = phone.replace(/\D/g, '');
          if (cleanDigits.length < 10) {
            setErrorMessage('Please enter a valid 10-digit mobile number.');
            setLoading(false);
            return;
          }

          try {
            const res = await fetch(`${API_BASE}/api/auth/send-otp`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ phone_number: phone.trim() })
            });
            const data = await res.json();
            if (res.ok && data.success) {
              setNotification(data.message || `Verification OTP sent to ${phone} via SMS.`);
              setOtpStep('enter_code');
              setResendCountdown(30);
              setTimeout(() => {
                const el = document.getElementById('digit-0');
                if (el) el.focus();
              }, 150);
            } else {
              throw new Error(data.detail || 'Failed to dispatch SMS');
            }
          } catch (err) {
            setErrorMessage(err.message || 'Unable to dispatch SMS OTP.');
          } finally {
            setLoading(false);
          }
        } else if (authMode === 'email_otp') {
          if (!email || !email.includes('@')) {
            setErrorMessage('Please enter a valid Gmail / Email address.');
            setLoading(false);
            return;
          }

          try {
            const res = await fetch(`${API_BASE}/api/auth/send-email-otp`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ email: email.trim() })
            });
            const data = await res.json();
            if (res.ok && data.success) {
              setNotification(data.message || `Security verification code sent to ${email}`);
              setOtpStep('enter_code');
              setResendCountdown(30);
              setTimeout(() => {
                const el = document.getElementById('digit-0');
                if (el) el.focus();
              }, 150);
            } else {
              throw new Error(data.detail || 'Failed to dispatch email code');
            }
          } catch (err) {
            setErrorMessage(err.message || 'Unable to send email code.');
          } finally {
            setLoading(false);
          }
        }
      };

      // 6-Digit Auto-advance handling
      const handleDigitChange = (idx, val) => {
        if (val.length > 1) {
          const raw = val.replace(/\D/g, '').slice(0, 6).split('');
          const newArr = [...otpDigits];
          raw.forEach((d, i) => { if (i < 6) newArr[i] = d; });
          setOtpDigits(newArr);
          const next = Math.min(raw.length, 5);
          const el = document.getElementById(`digit-${next}`);
          if (el) el.focus();
          return;
        }

        const newArr = [...otpDigits];
        newArr[idx] = val.replace(/\D/g, '');
        setOtpDigits(newArr);

        if (val && idx < 5) {
          const nextEl = document.getElementById(`digit-${idx + 1}`);
          if (nextEl) nextEl.focus();
        }
      };

      const handleDigitKeyDown = (idx, e) => {
        if (e.key === 'Backspace' && !otpDigits[idx] && idx > 0) {
          const prevEl = document.getElementById(`digit-${idx - 1}`);
          if (prevEl) prevEl.focus();
        }
      };

      // 2. VERIFY OTP (SMS / EMAIL)
      const handleVerifyOtp = async (e) => {
        if (e) e.preventDefault();
        const code = otpDigits.join('');
        if (code.length < 6) {
          setErrorMessage('Please enter the complete 6-digit verification code.');
          setIsShaking(true);
          setTimeout(() => setIsShaking(false), 500);
          return;
        }

        setErrorMessage('');
        setLoading(true);

        const endpoint = authMode === 'phone_otp' ? '/api/auth/verify-otp' : '/api/auth/verify-email-otp';
        const payload = authMode === 'phone_otp' 
          ? { phone_number: phone.trim(), otp: code, role: role }
          : { email: email.trim(), otp: code, role: role };

        try {
          const res = await fetch(`${API_BASE}${endpoint}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          if (res.ok && data.user) {
            handleAuthSuccess(data);
          } else {
            throw new Error(data.detail || 'Invalid or expired verification code');
          }
        } catch (err) {
          setErrorMessage(err.message || 'Verification failed. Please check the code.');
          setIsShaking(true);
          setTimeout(() => setIsShaking(false), 500);
        } finally {
          setLoading(false);
        }
      };

      // 3. PASSWORD LOGIN
      const handlePasswordLogin = async (e) => {
        e.preventDefault();
        setErrorMessage('');
        setLoading(true);

        try {
          const res = await fetch(`${API_BASE}/api/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email.trim(), password, role })
          });
          const data = await res.json();
          if (res.ok && data.user) {
            handleAuthSuccess(data);
          } else {
            throw new Error(data.detail || 'Invalid email or password');
          }
        } catch (err) {
          setErrorMessage(err.message || 'Login failed.');
        } finally {
          setLoading(false);
        }
      };

      // 4. SIGN UP
      const handleSignUpSubmit = async (e) => {
        e.preventDefault();
        setErrorMessage('');
        setLoading(true);

        const payload = {
          name: signupName.trim(),
          email: signupEmail.trim(),
          phone_number: signupPhone.trim(),
          password: signupPassword,
          role: role,
          age: signupAge ? parseInt(signupAge) : 25,
          specialization: role === 'doctor' ? signupSpecialization : null,
          qualification: role === 'doctor' ? signupQualification : null,
          fee: role === 'doctor' && signupFee ? parseInt(signupFee) : null
        };

        try {
          const res = await fetch(`${API_BASE}/api/auth/signup`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          if (res.ok && data.user) {
            handleAuthSuccess(data);
          } else {
            throw new Error(data.detail || 'Sign up failed');
          }
        } catch (err) {
          setErrorMessage(err.message || 'Unable to register account.');
        } finally {
          setLoading(false);
        }
      };

      return (
        <div style={{ position: 'fixed', inset: 0, width: '100vw', height: '100vh', zIndex: 500, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '0 40px', overflow: 'hidden' }}>

            <div className="orb orb-1"></div>
            <div className="orb orb-2"></div>
            <div className="orb orb-3"></div>

            {/* Dynamic Waves */}
            <svg className="animated-waves" viewBox="0 0 1440 320" preserveAspectRatio="none">
              <path className="wave-path-1" fill="#3b82f6" fillOpacity="0.25" d="M0,192L48,197.3C96,203,192,213,288,192C384,171,480,117,576,122.7C672,128,768,192,864,208C960,224,1056,192,1152,165.3C1248,139,1344,117,1392,106.7L1440,96L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path>
              <path className="wave-path-2" fill="#2563eb" fillOpacity="0.65" d="M0,224L48,229.3C96,235,192,245,288,224C384,203,480,149,576,144C672,139,768,181,864,208C960,235,1056,245,1152,229.3C1248,213,1344,171,1392,149.3L1440,128L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path>

            {/* LEFT HERO BRANDING & LIVE STATUS */}
            <div>
              <div style={{ display: 'flex', alignItems: 'center', gap: '14px', marginBottom: '24px' }}>
                <MedicalCrossLogo />
                <div>
                  <h3 style={{ fontSize: '1.6rem', fontWeight: 800, color: '#1e3a8a', margin: 0, lineHeight: 1, fontFamily: "'Outfit', sans-serif" }}>MediCare</h3>
                  <span style={{ fontSize: '0.78rem', color: '#2563eb', fontWeight: 700, display: 'block', marginTop: '3px', letterSpacing: '0.5px' }}>YOUR HEALTH, OUR PRIORITY</span>

                </h2>
                <p style={{ color: '#64748b', fontSize: '0.8rem', marginBottom: '16px' }}>
                  {authView === 'signup' ? `Register your ${role} profile` : `Access your ${role} portal with secure verification`}
                </p>

                {/* Role Switcher Pill */}
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '6px', background: '#f1f5f9', padding: '4px', borderRadius: '14px', marginBottom: '14px', border: '1px solid #e2e8f0' }}>
                  <button type="button" onClick={() => setRole('patient')} style={{ background: role === 'patient' ? '#2563eb' : 'transparent', color: role === 'patient' ? '#ffffff' : '#64748b', fontWeight: 700, padding: '8px', borderRadius: '10px', border: 'none', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '6px', fontSize: '0.82rem', transition: 'all 0.2s ease', boxShadow: role === 'patient' ? '0 4px 12px rgba(37, 99, 235, 0.25)' : 'none' }}>
                    <PatientIconSVG active={role === 'patient'} /> Patient
                  </button>
                  <button type="button" onClick={() => setRole('doctor')} style={{ background: role === 'doctor' ? '#2563eb' : 'transparent', color: role === 'doctor' ? '#ffffff' : '#64748b', fontWeight: 700, padding: '8px', borderRadius: '10px', border: 'none', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '6px', fontSize: '0.82rem', transition: 'all 0.2s ease', boxShadow: role === 'doctor' ? '0 4px 12px rgba(37, 99, 235, 0.25)' : 'none' }}>
                    <DoctorIconSVG active={role === 'doctor'} /> Doctor
                  </button>
                </div>

                {/* Login / Sign Up Switcher */}
                <div style={{ display: 'flex', borderBottom: '2px solid #e2e8f0', marginBottom: '16px' }}>
                  <button type="button" onClick={() => { setAuthView('login'); setErrorMessage(''); setNotification(''); setOtpStep('enter_contact'); }} style={{ flex: 1, padding: '8px', background: 'none', border: 'none', borderBottom: authView === 'login' ? '2.5px solid #2563eb' : 'none', color: authView === 'login' ? '#2563eb' : '#64748b', fontWeight: 700, fontSize: '0.85rem', cursor: 'pointer', marginBottom: '-2px' }}>
                    Login
                  </button>
                  <button type="button" onClick={() => { setAuthView('signup'); setErrorMessage(''); setNotification(''); }} style={{ flex: 1, padding: '8px', background: 'none', border: 'none', borderBottom: authView === 'signup' ? '2.5px solid #2563eb' : 'none', color: authView === 'signup' ? '#2563eb' : '#64748b', fontWeight: 700, fontSize: '0.85rem', cursor: 'pointer', marginBottom: '-2px' }}>
                    Sign Up
                  </button>
                </div>

                {/* Notifications & Error Alerts */}
                {notification && (
                  <div style={{ background: '#eff6ff', border: '1px solid #bfdbfe', color: '#1d4ed8', padding: '10px 12px', borderRadius: '10px', fontSize: '0.8rem', fontWeight: 600, marginBottom: '14px', textAlign: 'left', display: 'flex', gap: '8px', alignItems: 'center' }}>
                    <span>✓</span> <span>{notification}</span>
                  </div>
                )}
                {errorMessage && (
                  <div style={{ background: '#fef2f2', border: '1px solid #fecaca', color: '#dc2626', padding: '10px 12px', borderRadius: '10px', fontSize: '0.8rem', fontWeight: 600, marginBottom: '14px', textAlign: 'left', display: 'flex', gap: '8px', alignItems: 'center' }}>
                    <span>⚠️</span> <span>{errorMessage}</span>
                  </div>
                )}

                {/* 1-Click Google Sign In Button */}
                <button
                  type="button"
                  onClick={handleGoogleLogin}
                  className="btn-google-signin"
                >
                  <svg width="20" height="20" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                  </svg>

                  <span style={{ marginLeft: 'auto', background: '#e8f0fe', color: '#1a73e8', fontSize: '0.72rem', padding: '2px 8px', borderRadius: '10px', fontWeight: 700 }}>
                    1-Click

                </button>

                <div style={{ display: 'flex', alignItems: 'center', gap: '10px', margin: '2px 0 14px 0', color: '#94a3b8', fontSize: '0.72rem', fontWeight: 600 }}>
                  <div style={{ flex: 1, height: '1px', background: '#e2e8f0' }}></div>
                  <span>OR CONTINUE WITH {authView === 'signup' ? 'DETAILS' : 'OTP / PASSWORD'}</span>
                  <div style={{ flex: 1, height: '1px', background: '#e2e8f0' }}></div>
                </div>

                {/* VIEW 1: SIGN UP FORM */}
                {authView === 'signup' ? (
                  <form onSubmit={handleSignUpSubmit} style={{ textAlign: 'left', display: 'flex', flexDirection: 'column', gap: '12px' }}>
                    <div>
                      <label style={{ fontSize: '0.78rem', fontWeight: 700, color: '#334155', display: 'block', marginBottom: '4px' }}>Full Name *</label>
                      <input className="glow-input" placeholder={role === 'doctor' ? 'Dr. Full Name' : 'Your Full Name'} value={signupName} onChange={e=>setSignupName(e.target.value)} required />
                    </div>

                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px' }}>
                      <div>
                        <label style={{ fontSize: '0.78rem', fontWeight: 700, color: '#334155', display: 'block', marginBottom: '4px' }}>Email Address *</label>
                        <input type="email" className="glow-input" placeholder="user@gmail.com" value={signupEmail} onChange={e=>setSignupEmail(e.target.value)} required />
                      </div>
                      <div>
                        <label style={{ fontSize: '0.78rem', fontWeight: 700, color: '#334155', display: 'block', marginBottom: '4px' }}>Mobile Number *</label>
                        <input type="tel" className="glow-input" placeholder="+91 9876543210" value={signupPhone} onChange={e=>setSignupPhone(e.target.value)} required />
                      </div>
                    </div>

                    {role === 'doctor' ? (
                      <>
                        <div style={{ display: 'grid', gridTemplateColumns: '1.2fr 0.8fr', gap: '10px' }}>
                          <div>
                            <label style={{ fontSize: '0.78rem', fontWeight: 700, color: '#334155', display: 'block', marginBottom: '4px' }}>Specialization</label>
                            <select value={signupSpecialization} onChange={e=>setSignupSpecialization(e.target.value)} style={{ width: '100%', padding: '11px 10px', borderRadius: '12px', border: '1.5px solid #cbd5e1', fontSize: '0.85rem', outline: 'none', background: '#fff' }}>
                              <option value="General Physician">General Physician</option>
                              <option value="Cardiologist">Cardiologist</option>
                              <option value="Dermatologist">Dermatologist</option>
                              <option value="Neurologist">Neurologist</option>
                              <option value="Pulmonologist">Pulmonologist</option>
                              <option value="Orthopedist">Orthopedist</option>
                            </select>
                          </div>
                          <div>
                            <label style={{ fontSize: '0.78rem', fontWeight: 700, color: '#334155', display: 'block', marginBottom: '4px' }}>Fee (₹)</label>
                            <input type="number" className="glow-input" placeholder="600" value={signupFee} onChange={e=>setSignupFee(e.target.value)} />
                          </div>
                        </div>
                        <div>
                          <label style={{ fontSize: '0.78rem', fontWeight: 700, color: '#334155', display: 'block', marginBottom: '4px' }}>Qualification</label>
                          <input type="text" className="glow-input" placeholder="e.g. MBBS, MD (10 Yrs Exp)" value={signupQualification} onChange={e=>setSignupQualification(e.target.value)} />
                        </div>
                      </>
                    ) : (
                      <div>
                        <label style={{ fontSize: '0.78rem', fontWeight: 700, color: '#334155', display: 'block', marginBottom: '4px' }}>Age</label>
                        <input type="number" className="glow-input" placeholder="e.g. 28" value={signupAge} onChange={e=>setSignupAge(e.target.value)} />
                      </div>
                    )}

                    <div>
                      <label style={{ fontSize: '0.78rem', fontWeight: 700, color: '#334155', display: 'block', marginBottom: '4px' }}>Password *</label>
                      <input type="password" className="glow-input" placeholder="Min. 6 characters" value={signupPassword} onChange={e=>setSignupPassword(e.target.value)} required />
                    </div>

                    <button type="submit" disabled={loading} className="btn-gradient-primary" style={{ marginTop: '4px' }}>
                      {loading ? 'Creating Account...' : 'Complete Sign Up →'}
                    </button>
                  </form>
                ) : (
                  /* VIEW 2: LOGIN FLOWS */
                  <div>
                    {/* OPTION A: MOBILE SMS OTP / EMAIL OTP */}
                    {(authMode === 'phone_otp' || authMode === 'email_otp') ? (
                      otpStep === 'enter_contact' ? (
                        /* STEP 1: ENTER CONTACT */
                        <form onSubmit={handleDispatchOtp} style={{ textAlign: 'left', display: 'flex', flexDirection: 'column', gap: '14px' }}>
                          <div>
                            <label style={{ fontSize: '0.8rem', fontWeight: 700, color: '#334155', display: 'block', marginBottom: '6px' }}>
                              {authMode === 'phone_otp' ? 'Mobile Number (E.164)' : 'Gmail / Email Address'}
                            </label>
                            
                            {authMode === 'phone_otp' ? (
                              <input
                                type="tel"
                                className="glow-input"
                                placeholder="+91 9876543210"
                                value={phone}
                                onChange={e=>setPhone(e.target.value)}
                                required
                                autoFocus
                              />
                            ) : (
                              <input
                                type="email"
                                className="glow-input"
                                placeholder="yourname@gmail.com"
                                value={email}
                                onChange={e=>setEmail(e.target.value)}
                                required
                                autoFocus
                              />
                            )}

                            <span style={{ fontSize: '0.72rem', color: '#64748b', marginTop: '5px', display: 'block' }}>
                              {authMode === 'phone_otp' 
                                ? 'A 6-digit verification code will be sent to your mobile phone via SMS.' 
                                : 'A 6-digit security code will be sent to your Gmail inbox.'}
                            </span>
                          </div>

                          <button type="submit" disabled={loading} className="btn-gradient-primary">
                            {loading 
                              ? 'Dispatching Code...' 
                              : (authMode === 'phone_otp' ? '📱 Send Mobile SMS OTP' : '📧 Send Gmail Security Code')}
                          </button>
                        </form>
                      ) : (
                        /* STEP 2: ENTER 6-DIGIT CODE */
                        <form onSubmit={handleVerifyOtp} style={{ textAlign: 'left', display: 'flex', flexDirection: 'column', gap: '16px' }}>
                          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                            <label style={{ fontSize: '0.8rem', fontWeight: 700, color: '#334155' }}>
                              Enter 6-Digit Code ({authMode === 'phone_otp' ? phone : email})
                            </label>
                            <button
                              type="button"
                              onClick={() => { setOtpStep('enter_contact'); setErrorMessage(''); }}
                              style={{ background: 'none', border: 'none', color: '#2563eb', fontSize: '0.76rem', fontWeight: 700, cursor: 'pointer' }}
                            >
                              Change
                            </button>
                          </div>

                          {/* 6 Individual Digit Boxes */}
                          <div style={{ display: 'flex', gap: '8px', justifyContent: 'center' }}>
                            {otpDigits.map((digit, idx) => (
                              <input
                                key={idx}
                                id={`digit-${idx}`}
                                type="text"
                                maxLength="1"
                                value={digit}
                                onChange={e => handleDigitChange(idx, e.target.value)}
                                onKeyDown={e => handleDigitKeyDown(idx, e)}
                                className={`otp-digit-input ${digit ? 'filled' : ''}`}
                              />
                            ))}
                          </div>

                          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', fontSize: '0.78rem', color: '#64748b' }}>
                            {resendCountdown > 0 ? (
                              <span>Resend in <strong style={{ color: '#2563eb' }}>{resendCountdown}s</strong></span>
                            ) : (
                              <button
                                type="button"
                                onClick={handleDispatchOtp}
                                style={{ background: 'none', border: 'none', color: '#2563eb', fontWeight: 700, cursor: 'pointer', fontSize: '0.78rem' }}
                              >
                                🔄 Resend Code
                              </button>
                            )}
                          </div>

                          <button type="submit" disabled={loading} className="btn-gradient-primary">
                            {loading ? 'Verifying Code...' : '✓ Verify Code & Sign In'}
                          </button>
                        </form>
                      )
                    ) : (
                      /* OPTION B: STANDARD EMAIL & PASSWORD */
                      <form onSubmit={handlePasswordLogin} style={{ textAlign: 'left', display: 'flex', flexDirection: 'column', gap: '14px' }}>
                        <div>
                          <label style={{ fontSize: '0.8rem', fontWeight: 700, color: '#334155', display: 'block', marginBottom: '5px' }}>
                            Email Address
                          </label>
                          <input type="email" className="glow-input" placeholder="user@gmail.com" value={email} onChange={e=>setEmail(e.target.value)} required />
                        </div>

                        <div>
                          <label style={{ fontSize: '0.8rem', fontWeight: 700, color: '#334155', display: 'block', marginBottom: '5px' }}>
                            Password
                          </label>
                          <input type="password" className="glow-input" placeholder="••••••••" value={password} onChange={e=>setPassword(e.target.value)} required />
                        </div>

                        <button type="submit" disabled={loading} className="btn-gradient-primary">
                          {loading ? 'Authenticating...' : '➔ Sign In'}
                        </button>
                      </form>
                    )}

                    {/* Divider */}
                    <div style={{ display: 'flex', alignItems: 'center', gap: '12px', margin: '20px 0 14px 0', color: '#94a3b8', fontSize: '0.78rem', fontWeight: 600 }}>
                      <div style={{ flex: 1, height: '1px', background: '#e2e8f0' }}></div>
                      <span>authentication options</span>
                      <div style={{ flex: 1, height: '1px', background: '#e2e8f0' }}></div>
                    </div>

                    {/* Dual Auth Selector Buttons */}
                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px' }}>
                      <button
                        type="button"
                        onClick={() => { setAuthMode('phone_otp'); setOtpStep('enter_contact'); setErrorMessage(''); setNotification(''); }}
                        style={{
                          background: authMode === 'phone_otp' ? '#eff6ff' : '#ffffff',
                          border: authMode === 'phone_otp' ? '1.8px solid #2563eb' : '1px solid #cbd5e1',
                          color: authMode === 'phone_otp' ? '#2563eb' : '#334155',
                          fontWeight: 700,
                          padding: '10px 8px',
                          borderRadius: '12px',
                          cursor: 'pointer',
                          display: 'flex',
                          alignItems: 'center',
                          justifyContent: 'center',
                          gap: '6px',
                          fontSize: '0.8rem',
                          transition: 'all 0.2s ease',
                          boxShadow: '0 2px 6px rgba(0,0,0,0.03)'
                        }}
                      >
                        <span>📱</span> Mobile SMS OTP
                      </button>

                      <button
                        type="button"
                        onClick={() => { setAuthMode('email_otp'); setOtpStep('enter_contact'); setErrorMessage(''); setNotification(''); }}
                        style={{
                          background: authMode === 'email_otp' ? '#eff6ff' : '#ffffff',
                          border: authMode === 'email_otp' ? '1.8px solid #2563eb' : '1px solid #cbd5e1',
                          color: authMode === 'email_otp' ? '#2563eb' : '#334155',
                          fontWeight: 700,
                          padding: '10px 8px',
                          borderRadius: '12px',
                          cursor: 'pointer',
                          display: 'flex',
                          alignItems: 'center',
                          justifyContent: 'center',
                          gap: '6px',
                          fontSize: '0.8rem',
                          transition: 'all 0.2s ease',
                          boxShadow: '0 2px 6px rgba(0,0,0,0.03)'
                        }}
                      >
                        <span>📧</span> Gmail OTP
                      </button>
                    </div>

                    <div style={{ marginTop: '10px', textAlign: 'center' }}>
                      <button
                        type="button"
                        onClick={() => { setAuthMode(authMode === 'password' ? 'phone_otp' : 'password'); setOtpStep('enter_contact'); setErrorMessage(''); setNotification(''); }}
                        style={{ background: 'none', border: 'none', color: '#64748b', fontSize: '0.78rem', fontWeight: 600, cursor: 'pointer', textDecoration: 'underline' }}
                      >
                        {authMode === 'password' ? '← Switch to OTP Verification' : 'Use Email & Password instead'}
                      </button>
                    </div>

                  </div>
                )}

              </div>
            </div>

          </div>

        </div>
      );
    }

    // Chatbot Component
    function ChatWidget({ onClose, onFilterSpec }) {
      const [msgs, setMsgs] = useState([
        { sender: 'bot', text: "Hello! I am your MediAI Health Assistant. 👋\nDescribe your symptoms (e.g. 'chest pain', 'skin rash', 'wheezing') to receive an AI assessment and doctor recommendation." }
      ]);
      const [input, setInput] = useState('');

      const handleSend = () => {
        if (!input.trim()) return;
        const text = input.trim();
        setInput('');
        setMsgs(prev => [...prev, { sender: 'user', text }]);

        setTimeout(() => {
          const isEmerg = /chest pain|shortness of breath|stroke|slurred speech/i.test(text);
          let reply = "";
          let spec = "General Physician";

          if (isEmerg) {
            reply = "⚠️ CRITICAL ALERT: Your reported symptoms indicate a potential medical emergency (e.g. cardiac event). Please visit the nearest Emergency Room (ER) immediately!";
            spec = "Cardiologist";
          } else if (/skin|rash|acne|itching/i.test(text)) {
            reply = "Based on your skin symptoms, our AI assessment suggests consulting a Dermatologist.";
            spec = "Dermatologist";
          } else if (/headache|numbness|dizziness|brain/i.test(text)) {
            reply = "Based on your neurological symptoms, we recommend consulting a Neurologist.";
            spec = "Neurologist";
          } else if (/cough|wheezing|fever|breathe/i.test(text)) {
            reply = "Based on your respiratory symptoms, we recommend consulting a Pulmonologist.";
            spec = "Pulmonologist";
          } else {
            reply = `Based on your reported symptoms ('${text}'), we recommend consulting a General Physician for preliminary diagnosis.`;
          }

          setMsgs(prev => [...prev, { sender: 'bot', text: reply, isEmerg, spec }]);
        }, 600);
      };

      return (
        <div className="chat-drawer">
          <div className="chat-header">
            <h4 style={{ color: '#0f172a', fontWeight: 700 }}>🤖 AI Health Assistant</h4>
            <button onClick={onClose} style={{ background: 'none', border: 'none', color: '#64748b', cursor: 'pointer', fontSize: '1.1rem' }}>✕</button>
          </div>
          <div className="chat-body">
            {msgs.map((m, i) => (
              <div key={i} className={`chat-msg ${m.sender} ${m.isEmerg ? 'emergency' : ''}`}>
                <p style={{ whiteSpace: 'pre-line' }}>{m.text}</p>
                {m.spec && !m.isEmerg && (
                  <button className="btn-gradient-primary" style={{ marginTop: '8px', fontSize: '0.8rem', width: '100%', justifyContent: 'center' }} onClick={() => onFilterSpec(m.spec)}>
                    Find {m.spec} Doctors →
                  </button>
                )}
              </div>
            ))}
          </div>
          <div className="chat-footer">
            <input className="glow-input" placeholder="Type symptoms..." value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&handleSend()} />
            <button className="btn-gradient-primary" style={{ width: 'auto', padding: '10px 18px' }} onClick={handleSend}>Send</button>
          </div>
        </div>
      );
    }

    // Booking Modal Component
    function BookingModal({ doctor, onClose, onSuccess }) {
      const [name, setName] = useState('Rohan Das');
      const [age, setAge] = useState('28');
      const [slot, setSlot] = useState(doctor.available_slots[0]);
      const [symptoms, setSymptoms] = useState('');

      const handleConfirm = (e) => {
        e.preventDefault();
        onSuccess({
          id: `apt-${Math.floor(Math.random()*1000)}`,
          patient_name: name,
          patient_age: parseInt(age),
          doctor_name: doctor.name,
          specialization: doctor.specialization,
          date: '2026-08-28',
          slot: slot,
          status: 'Confirmed',
          symptoms: symptoms || 'General consultation',
          ai_summary: `Patient reported: '${symptoms || 'General Checkup'}'. Matched with ${doctor.name} (${doctor.specialization}).`
        });
      };

      return (
        <div className="modal-overlay">
          <div className="modal-content" style={{ background: '#ffffff' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '16px' }}>
              <h3 style={{ color: '#0f172a' }}>Book Appointment with {doctor.name}</h3>
              <button onClick={onClose} style={{ background: 'none', border: 'none', color: '#64748b', cursor: 'pointer' }}>✕</button>
            </div>
            <form onSubmit={handleConfirm} style={{ display: 'flex', flexDirection: 'column', gap: '14px' }}>
              <div>
                <label style={{ fontSize: '0.8rem', color: 'var(--text-muted)', fontWeight: 600 }}>Patient Name</label>
                <input className="glow-input" style={{ background: '#f8fafc' }} value={name} onChange={e=>setName(e.target.value)} required />
              </div>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px' }}>
                <div>
                  <label style={{ fontSize: '0.8rem', color: 'var(--text-muted)', fontWeight: 600 }}>Age</label>
                  <input type="number" className="glow-input" style={{ background: '#f8fafc' }} value={age} onChange={e=>setAge(e.target.value)} required />
                </div>
                <div>
                  <label style={{ fontSize: '0.8rem', color: 'var(--text-muted)', fontWeight: 600 }}>Time Slot</label>
                  <select className="glow-input" style={{ background: '#f8fafc' }} value={slot} onChange={e=>setSlot(e.target.value)}>
                    {doctor.available_slots.map((s, i) => <option key={i} value={s}>{s}</option>)}
                  </select>
                </div>
              </div>
              <div>
                <label style={{ fontSize: '0.8rem', color: 'var(--text-muted)', fontWeight: 600 }}>Symptoms / Notes for Doctor</label>
                <textarea className="glow-input" style={{ width: '100%', height: '60px', background: '#f8fafc' }} value={symptoms} onChange={e=>setSymptoms(e.target.value)} placeholder="Describe symptoms..." />
              </div>
              <button type="submit" className="btn-gradient-primary" style={{ justifyContent: 'center', marginTop: '10px' }}>Confirm Appointment Booking</button>
            </form>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
